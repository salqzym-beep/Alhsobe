<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنبر الحوشبي الدعوي</title>
<style>
:root{--green:#0c5b45;--deep:#073b30;--gold:#d8b66a;--bg:#f4f7f2;--ink:#19332b}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--deep),var(--green));color:white;padding:28px 16px;text-align:center;position:relative;overflow:hidden}
header:before{content:"۞";position:absolute;font-size:150px;opacity:.07;left:10px;top:-35px}
.brand{font-size:25px;font-weight:bold;cursor:pointer;display:inline-block;line-height:1.5}.subtitle{color:#e9d9a8;margin-top:7px;font-size:14px}
nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:18px 12px}
nav button,.btn{border:2px solid #d8b66a;border-radius:25px;padding:12px 24px;background:rgba(7,59,48,.94);color:white;font-weight:bold;cursor:pointer}
nav button.active{background:var(--gold);color:var(--deep)}
.quran-heading{text-align:center;color:#0c5b45;background:#fff;border-radius:12px;padding:12px;margin:10px auto 18px;max-width:900px}
main{max-width:1050px;margin:auto;padding:12px 16px 40px}.section-title{text-align:center;color:var(--deep);margin:10px 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 3px 15px #143b2910;border:1px solid #e4ebe4}
.reciter{display:flex;align-items:center;gap:12px}.photo{width:68px;height:68px;object-fit:cover;border-radius:50%;background:#e4eee6}
h3{margin:5px 0;color:var(--deep)}.muted{font-size:13px;color:#6b7c73}
.audio-row{border-top:1px solid #edf0eb;padding-top:12px;margin-top:12px}.audio-row audio{width:100%;margin-top:8px}
.empty{text-align:center;padding:35px;color:#718177;background:white;border-radius:15px}
#admin{display:none;background:white;padding:18px;border-radius:16px;margin:20px 0;border:1px solid #dce7dc}
#admin h2{color:var(--deep)}.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d3ded5;border-radius:9px;font:inherit;background:#fff}
label{display:block;font-size:13px;margin-bottom:5px;color:#456054}
.formbox{background:#f7faf6;padding:14px;border-radius:12px;margin:12px 0}
.items-admin{display:grid;gap:8px}.admin-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f3f7f2;padding:10px;border-radius:9px}
.del{background:#a93636;padding:7px 12px;border-radius:8px;border:0;color:white;cursor:pointer}
footer{text-align:center;padding:25px;background:var(--deep);color:#e8d9a8;font-size:13px}
@media(max-width:500px){.brand{font-size:21px}nav button{padding:10px 14px}}
</style>
</head>
<body>

<header>
  <div class="brand" onclick="toggleAdmin()">المنبر الحوشبي الدعوي</div>
  <div class="subtitle">تلاوات خاشعة • محاضرات • خطب ودروس علمية</div>
</header>

<nav>
  <button class="active" onclick="filterItems('all', this)">الكل</button>
  <button onclick="filterItems('quran', this)">القرآن الكريم</button>
  <button onclick="filterItems('lectures', this)">المحاضرات والدروس</button>
  <button onclick="filterItems('khutbah', this)">الخطب المنبرية</button>
</nav>

<main>
  <!-- لوحة الإدارة (تظهر بالضغط على اسم المنبر في الأعلى) -->
  <section id="admin">
    <h2>لوحة إدارة المحتوى (حفظ سحابي في Blob)</h2>
    <div class="formbox">
      <div class="forms">
        <div>
          <label>القسم</label>
          <select id="cat">
            <option value="quran">القرآن الكريم</option>
            <option value="lectures">المحاضرات والدروس</option>
            <option value="khutbah">الخطب المنبرية</option>
          </select>
        </div>
        <div>
          <label>اسم الشيخ / القارئ</label>
          <input type="text" id="sheikh" placeholder="مثال: الشيخ فلان الحوشبي">
        </div>
        <div>
          <label>عنوان المادة / السورة</label>
          <input type="text" id="title" placeholder="مثال: سورة الكهف">
        </div>
        <div>
          <label>رابط الصوت المباشر (MP3)</label>
          <input type="url" id="audio" placeholder="https://...">
        </div>
        <div>
          <label>رابط صورة الشيخ (اختياري)</label>
          <input type="url" id="photo" placeholder="https://...">
        </div>
      </div>
      <div style="margin-top:12px;text-align:left">
        <button class="btn" id="saveBtn" onclick="addItem()">إضافة وحفظ في Blob</button>
      </div>
    </div>

    <h3>المواد المضافة حالياً</h3>
    <div id="adminList" class="items-admin"></div>
  </section>

  <!-- عرض المحتوى للزوار -->
  <div id="content" class="cards">
    <div class="empty">جاري تحميل المواد الصوتية...</div>
  </div>
</main>

<footer>
  جميع الحقوق محفوظة © المنبر الحوشبي الدعوي
</footer>

<script>
let items = [];
let currentFilter = 'all';

// جلب البيانات من Vercel Blob عند فتح الصفحة
async function init() {
  try {
    const res = await fetch('/api/save');
    if (res.ok) {
      items = await res.json();
    }
  } catch (err) {
    console.error('خطأ في الجلب:', err);
  }
  render();
}

// حفظ البيانات في Vercel Blob
async function syncBlob() {
  const btn = document.getElementById('saveBtn');
  if (btn) btn.textContent = 'جاري الحفظ...';
  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items)
    });
    if (!res.ok) throw new Error('فشل الحفظ');
  } catch (err) {
    alert('حدث خطأ أثناء الحفظ في Vercel Blob تأكد من ربط التخزين.');
  } finally {
    if (btn) btn.textContent = 'إضافة وحفظ في Blob';
  }
}

// إضافة مادة جديدة
async function addItem() {
  const cat = document.getElementById('cat').value;
  const sheikh = document.getElementById('sheikh').value.trim();
  const title = document.getElementById('title').value.trim();
  const audio = document.getElementById('audio').value.trim();
  const photo = document.getElementById('photo').value.trim();

  if (!sheikh || !title || !audio) {
    return alert('يرجى تعبئة اسم الشيخ والعنوان ورابط الصوت');
  }

  items.unshift({ id: Date.now(), cat, sheikh, title, audio, photo });
  
  document.getElementById('sheikh').value = '';
  document.getElementById('title').value = '';
  document.getElementById('audio').value = '';
  document.getElementById('photo').value = '';

  render();
  await syncBlob();
}

// حذف مادة
async function deleteItem(id) {
  if (!confirm('هل تريد حذف هذه المادة؟')) return;
  items = items.filter(i => i.id !== id);
  render();
  await syncBlob();
}

// تصفية الأقسام
function filterItems(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// إظهار / إخفاء لوحة الإدارة
function toggleAdmin() {
  const box = document.getElementById('admin');
  if (box.style.display === 'block') {
    box.style.display = 'none';
  } else {
    const pass = prompt('أدخل رمز الإدارة:');
    if (pass === '1234') { // يمكنك تغيير كلمة المرور من هنا
      box.style.display = 'block';
    } else if (pass !== null) {
      alert('الرمز غير صحيح');
    }
  }
}

// رسم الواجهة
function render() {
  const container = document.getElementById('content');
  const adminList = document.getElementById('adminList');
  
  const filtered = currentFilter === 'all' ? items : items.filter(i => i.cat === currentFilter);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">لا توجد مواد مضافة في هذا القسم حالياً.</div>';
  } else {
    container.innerHTML = filtered.map(item => `
      <div class="card">
        <div class="reciter">
          <img class="photo" src="${item.photo || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%230c5b45%22><circle cx=%2212%22 cy=%228%22 r=%224%22/><path d=%22M4 20c0-4 4-6 8-6s8 2 8 6%22/></svg>'}" alt="">
          <div>
            <h3>${item.title}</h3>
            <div class="muted">${item.sheikh}</div>
          </div>
        </div>
        <div class="audio-row">
          <audio controls preload="none" src="${item.audio}"></audio>
        </div>
      </div>
    `).join('');
  }

  adminList.innerHTML = items.map(item => `
    <div class="admin-item">
      <div><strong>${item.title}</strong> - <span class="muted">${item.sheikh}</span></div>
      <button class="del" onclick="deleteItem(${item.id})">حذف</button>
    </div>
  `).join('');
}

init();
</script>
</body>
</html>
